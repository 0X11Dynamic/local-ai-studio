[package]
name = "local-ai-studio"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Local AI Studio desktop app"

[lib]
name = "local_ai_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
app-core.workspace = true
persistence.workspace = true
system-monitor.workspace = true
security.workspace = true
model-registry.workspace = true
inference.workspace = true
downloader.workspace = true
local-api.workspace = true
mcp-client.workspace = true
agent-runtime.workspace = true
execution.workspace = true
execution-ssh.workspace = true
execution-docker.workspace = true
skills.workspace = true
futures.workspace = true
async-trait = "0.1.92"
base64.workspace = true
# PDF text extraction for chat attachments (pure Rust).
pdf-extract = "0.12.1"
windows = { workspace = true, features = ["Win32_Security_Cryptography", "Win32_UI_Shell", "Win32_System_Registry"] }

tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-opener = "2.7.3"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
reqwest.workspace = true

[dev-dependencies]
jsonschema = { version = "0.61.1", default-features = false }
