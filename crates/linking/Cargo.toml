[package]
name = "linking"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Linked PCs: pairing with a one-time code, pinned keys and the encrypted tunnel to a helper's ggml-rpc-server"

[dependencies]
app-core.workspace = true
security.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
# Socket buffer sizes on the tunnel sockets.
socket2 = "0.6.5"
tracing.workspace = true
base64.workspace = true
sha2.workspace = true
regex.workspace = true
# Noise Protocol Framework (XX / XXpsk3, X25519, ChaCha20-Poly1305, BLAKE2s).
snow = { version = "0.10.0", default-features = false, features = ["std", "use-curve25519", "use-chacha20poly1305", "use-blake2", "use-getrandom"] }
# SPAKE2 password-authenticated key exchange (RustCrypto PAKEs): turns the
# short one-time code into a strong key without offline guessing.
spake2 = "0.4.0"
getrandom = "0.3.4"
# Optional compression inside the tunnel (pure Rust, safe decoder).
lz4_flex = "0.14.2"
# UPnP IGD port mapping on the helper's router.
igd-next = { version = "0.18.0", default-features = false, features = ["aio_tokio"] }

[dev-dependencies]
tempfile.workspace = true
